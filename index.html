<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TripMate - Travel Planner</title>
  <link rel="stylesheet" href="style.css" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha512-xodZBNTC5n17Xt2atTPuE1HxjVMSvLVW9ocqUKLsCC5CXdbqCmblAshOMAS6/keqq/sMZMZ19scR4PsZChSR7A=="
    crossorigin=""
  />
</head>
<body>
  <div id="app">
    <h1>TripMate - Travel Planner</h1>
    <div id="map"></div>
    <div id="controls">
      <input type="text" id="searchInput" placeholder="Search for places..." />
      <button id="searchBtn">Search</button>
      <ul id="results"></ul>
    </div>
    <div id="itinerary">
      <h2>Itinerary</h2>
      <ul id="itineraryList"></ul>
      <button id="saveJSON">Save as JSON</button>
    </div>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha512-QVn0C2cayujDULPt+8UoElS9dLj9DQGztCzvXvGhST3Fw6nUdsSyQElwrJ+PvPbtzP3d8wH1zjz8eqFVGHunwQ=="
    crossorigin=""
  ></script>
  <script src="app.js"></script>
</body>
</html>
