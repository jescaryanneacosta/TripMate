<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripMate – Travel Planner with Map View</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> <!-- Link to external CSS -->
</head>
<body>
    <div id="map-container">
        <input id="search-box" type="text" placeholder="Search for places..." />
        <div id="map"></div>
    </div>

    <div id="search-results-container">
        <h3>Search Results</h3>
        <ul id="search-results">
            <!-- Search results will be displayed here -->
        </ul>
    </div>

    <div id="itinerary-container">
        <h3>Your Itinerary</h3>
        <ul id="itinerary-list">
            <!-- Itinerary items will appear here -->
        </ul>
        <button onclick="exportItinerary()">Export Itinerary</button>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmation-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title"></h2>
            <p id="modal-message"></p>
            <button id="confirm-button">Yes, Add to Itinerary</button>
            <button id="cancel-button">Cancel</button>
        </div>
    </div>

    <script src="app.js"></script> <!-- Link to external JS file -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDtUfGZKSnjGLGBURciHBKL8waeg8U3UDg&libraries=places&callback=initMap" async defer></script>
</body>
</html>
