<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TripMate – Travel Planner</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <h1>🌍 TripMate</h1>
    <input id="search-input" type="text" placeholder="Search for places..." />
    <label class="switch">
      <input type="checkbox" id="theme-toggle">
      <span class="slider round"></span>
    </label>
  </header>

  <main>
    <div id="map"></div>
    <section id="sidebar">
      <h2>Your Itinerary</h2>
      <ul id="itinerary-list"></ul>
      <button id="export-btn">Export Itinerary as PDF</button>
    </section>
  </main>

  <!-- Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <p id="modal-text"></p>
      <div class="modal-actions">
        <button id="modal-confirm">Add</button>
        <button id="modal-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="export.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDtUfGZKSnjGLGBURciHBKL8waeg8U3UDg&libraries=places&callback=initMap" async defer></script>
</body>
</html>
